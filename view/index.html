<!DOCTYPE html>
<html lang="en">
	<head>
		<title>%VITE_APP_TITLE%</title>
		<meta charset="UTF-8" />
		<meta name="renderer" content="webkit" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link rel="shortcut icon" type="image/x-icon" href="/favicon.ico" />
		<style>
			html,
			body,
			#app {
				height: 100%;
			}

			* {
				margin: 0;
				padding: 0;
				font-family: 'Helvetica Neue', Helvetica, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', Arial, sans-serif;
			}

			.preload__wrap {
				display: flex;
				flex-direction: column;
				letter-spacing: 1px;
				background-color: #2f3447;
				position: fixed;
				left: 0;
				top: 0;
				height: 100%;
				width: 100%;
				z-index: 9999;
				transition: all 0.3s ease-in;
				opacity: 1;
				pointer-events: none;
			}

			.preload__wrap.is-hide {
				opacity: 0;
			}

			.preload__container {
				display: flex;
				justify-content: center;
				align-items: center;
				flex-direction: column;
				width: 100%;
				user-select: none;
				-webkit-user-select: none;
				flex-grow: 1;
			}

			.preload__name {
				font-size: 30px;
				color: #fff;
				letter-spacing: 5px;
				font-weight: bold;
				margin-bottom: 30px;
			}

			.preload__title {
				color: #fff;
				font-size: 14px;
				margin: 30px 0 20px 0;
			}

			.preload__sub-title {
				color: #ababab;
				font-size: 12px;
			}

			.preload__footer {
				text-align: center;
				padding: 10px 0 20px 0;
			}

			.preload__footer a {
				font-size: 12px;
				color: #ababab;
				text-decoration: none;
			}

			.preload__loading {
				height: 30px;
				width: 30px;
				border-radius: 30px;
				border: 7px solid currentColor;
				border-bottom-color: #2f3447 !important;
				position: relative;
				animation: r 1s infinite cubic-bezier(0.17, 0.67, 0.83, 0.67), bc 2s infinite ease-in;
				transform: rotate(0deg);
			}

			@keyframes r {
				from {
					transform: rotate(0deg);
				}

				to {
					transform: rotate(360deg);
				}
			}

			.preload__loading::after,
			.preload__loading::before {
				content: '';
				display: inline-block;
				position: absolute;
				bottom: -2px;
				height: 7px;
				width: 7px;
				border-radius: 10px;
				background-color: currentColor;
			}

			.preload__loading::after {
				left: -1px;
			}

			.preload__loading::before {
				right: -1px;
			}

			@keyframes bc {
				0% {
					color: #689cc5;
				}

				25% {
					color: #b3b7e2;
				}

				50% {
					color: #93dbe9;
				}

				75% {
					color: #abbd81;
				}

				100% {
					color: #689cc5;
				}
			}
		</style>
	</head>
	<body>
		<noscript>
			<strong>你的浏览器未开启javascript支持，请开启后刷新页面访问！</strong>
		</noscript>
		<div id="app" class="ma-ui">
			<div class="preload__wrap" id="Loading">
				<div class="preload__container">
					<p class="preload__name">%VITE_APP_TITLE%</p>
					<div class="preload__loading"></div>
					<p class="preload__title">正在加载资源...</p>
					<p class="preload__sub-title">初次加载资源可能需要较多时间 请耐心等待</p>
				</div>
				<div class="preload__footer">
					<a href="https://saithink.top" target="_blank">https://saithink.top</a>
				</div>
			</div>
		</div>
		<script type="module" src="/src/main.js"></script>
	<!-- 临时诊断横幅：把页面运行时的 JS 错误直接显示在屏幕顶部，便于定位"点击无反应"。
	     定位完成后连同下面整段 script 一起删除。 -->
	<script>
	(function () {
		var box = document.createElement('div');
		box.id = '__diag';
		// 默认隐藏，只有真正捕获到运行时错误才显示，避免常开遮挡界面
		box.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:2147483647;display:none;'
			+ 'background:#b00020;color:#fff;font:12px/1.6 monospace;padding:8px 12px;'
			+ 'max-height:42vh;overflow:auto;white-space:pre-wrap;word-break:break-all;'
			+ 'border-bottom:2px solid #7a0015;';
		var log = [];
		var t0 = performance.now();
		function push(tag, msg, show) {
			log.push('[' + (performance.now() - t0).toFixed(0) + 'ms ' + tag + '] ' + msg);
			box.textContent = '⚠ 运行时错误 — ' + log.join('\n');
			box.scrollTop = box.scrollHeight;
			if (show) box.style.display = 'block';
		}
		window.addEventListener('error', function (e) {
			var loc = (e.filename || '').split('/').pop() + ':' + e.lineno + ':' + e.colno;
			var stack = (e.error && e.error.stack) ? String(e.error.stack).slice(0, 700) : '(no stack)';
			push('ERROR', (loc ? loc + ' | ' : '') + (e.message || 'unknown'), true);
			push('STACK', stack);
		}, true);
		window.addEventListener('unhandledrejection', function (e) {
			var r = e.reason;
			var msg = (r && (r.message || r.msg)) || String(r).slice(0, 200);
			var stack = (r && r.stack) ? String(r.stack).slice(0, 800) : '(no stack)';
			push('PROMISE', msg, true);
			push('STACK', stack);
		});
		// Vue 渲染期抛的错会被 errorCaptured 吃掉，不会冒到 window.unhandledrejection，
		// 所以"按钮点击无反应"这类渲染中断必须从这里抓
		window.addEventListener('vue:error', function (e) {
			var d = e.detail || {};
			var comp = d.component && (d.component.$options.name || d.component.$options.__file);
			push('VUE_ERR', String(d.message || '').slice(0, 200), true);
			push('STACK', (comp ? '[' + comp + '] ' : '') + String(d.stack || '').slice(0, 800));
		});
		document.addEventListener('DOMContentLoaded', function () {
			document.body.appendChild(box);
		});
	})();
	</script>
	</body>
</html>
